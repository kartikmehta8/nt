name: Release (VS Code extension)

# Publishes the vscode-nt extension when a tag like vscode-vX.Y.Z is pushed.
# Packages the .vsix once, then publishes it to:
#   - the VS Code Marketplace (requires the VSCE_PAT secret)
#   - Open VSX          (only if the OVSX_PAT secret is set)

on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

jobs:
  publish-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode-nt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package extension
        run: pnpm exec vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Check for an Open VSX token
        id: ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Ensure Open VSX namespace exists
        if: steps.ovsx.outputs.present == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          PUBLISHER=$(node -p "require('./package.json').publisher")
          pnpm exec ovsx create-namespace "$PUBLISHER" --pat "$OVSX_PAT" || \
            echo "Namespace '$PUBLISHER' already exists, continuing."

      - name: Publish to Open VSX
        if: steps.ovsx.outputs.present == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx publish *.vsix --pat "$OVSX_PAT"
